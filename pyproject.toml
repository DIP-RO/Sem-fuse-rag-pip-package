[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semfuse"
version = "0.9.2"
description = "Lightweight multilingual semantic retrieval with first-class Bangla, English, Banglish, and mixed-language support, plus optional RAG."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SemFuse Contributors" }]
requires-python = ">=3.10"
keywords = [
  "semantic-search",
  "retrieval",
  "rag",
  "multilingual",
  "bangla",
  "banglish",
  "embeddings",
  "vector-search",
  "bm25",
  "hybrid-search",
  "nlp",
  "bengali",
  "transliteration",
  "information-retrieval",
  "local-llm",
  "evaluation",
  "benchmarking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
faiss = ["faiss-cpu>=1.7"]
qdrant = ["qdrant-client>=1.7"]
slm = ["llama-cpp-python>=0.3.0"]
slm-torch = ["transformers>=4.40", "torch>=2.0"]
rag = ["openai>=1.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.10",
]
all = [
  "sentence-transformers>=2.2",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "faiss-cpu>=1.7",
  "qdrant-client>=1.7",
  "llama-cpp-python>=0.3.0",
  "openai>=1.0",
]

[project.scripts]
semfuse = "semfuse.cli.main:main"

[project.urls]
Homepage = "https://github.com/DIP-RO/Sem-fuse-rag-pip-package"
Documentation = "https://github.com/DIP-RO/Sem-fuse-rag-pip-package#readme"
Issues = "https://github.com/DIP-RO/Sem-fuse-rag-pip-package/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semfuse = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
# Runtime supports 3.10+; numpy 2.x stubs need 3.12+ `type` statements to parse.
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/semfuse"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
