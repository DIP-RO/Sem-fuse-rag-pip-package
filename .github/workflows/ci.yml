name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ruff mypy numpy
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: |
          pip install -e . --no-deps
          mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Unit tests run fully offline: the deterministic hashing provider is
      # used everywhere, and integration tests auto-skip without a cached
      # model. sentence-transformers (torch) is deliberately NOT installed in
      # CI to keep runs fast; loader extras are installed so loader tests run.
      - name: Install
        run: |
          pip install numpy pytest pytest-cov pypdf python-docx
          pip install -e . --no-deps
      - name: Test
        run: pytest tests -q
