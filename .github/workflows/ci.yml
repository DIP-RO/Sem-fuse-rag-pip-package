name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check src/semfuse tests

      - name: Mypy
        run: mypy --python-version 3.12 src/semfuse

      - name: Pytest (offline unit/persistence/language)
        run: pytest tests/unit tests/persistence tests/language -p no:cacheprovider

  integration:
    # Integration tests download a real multilingual model; run separately and
    # allow skipping when the model is unavailable.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest tests/integration -p no:cacheprovider -v
